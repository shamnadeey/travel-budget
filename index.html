<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Daily Expense</title>
<style>
:root{
  --bg:#0B0D12; --bg-grad:#0F1320;
  --card:#151823; --card2:#1B1F2D; --line:#262B3A; --line-soft:#1E2230;
  --text:#EDEFF5; --text-soft:#8A90A6; --text-dim:#5B6178;
  --accent:#5B7CFA; --accent-soft:rgba(91,124,250,0.14); --accent-glow:rgba(91,124,250,0.35);
  --travelfood:#2FD1A6; --travelfood-soft:rgba(47,209,166,0.12);
  --reserve:#B285F7; --reserve-soft:rgba(178,133,247,0.14);
  --hotel:#FFA94D; --hotel-soft:rgba(255,169,77,0.14);
  --danger:#FF6B6B; --ok:#3ADB76; --warn:#FFC24B;
  --radius:14px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(600px 300px at 15% -5%, rgba(91,124,250,0.10), transparent 60%),
    radial-gradient(500px 260px at 100% 0%, rgba(178,133,247,0.08), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; padding-bottom:40px;
  -webkit-font-smoothing:antialiased;
}

@keyframes fadeSlideUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
@keyframes popIn{ 0%{opacity:0; transform:scale(.92);} 100%{opacity:1; transform:scale(1);} }
@keyframes pulseDot{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
@keyframes shimmerBar{ from{background-position:0 0;} to{background-position:40px 0;} }
@keyframes toastIn{ from{opacity:0; transform:translate(-50%,8px);} to{opacity:1; transform:translate(-50%,0);} }
@keyframes ringPulse{ 0%{box-shadow:0 0 0 0 var(--accent-glow);} 100%{box-shadow:0 0 0 10px rgba(91,124,250,0);} }

.top{position:sticky;top:0;z-index:10;background:rgba(11,13,18,0.86);backdrop-filter:blur(10px);padding:16px 16px 8px;border-bottom:1px solid var(--line-soft);}
.top-inner{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:baseline;}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-0.01em;}
.sync{font-size:11px;color:var(--text-soft);display:flex;align-items:center;gap:5px;}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulseDot 1.6s ease-in-out infinite;}
.sync.err .sync-dot{background:var(--danger);animation:none;}
.sync.err{color:var(--danger);}
.redirect-note{max-width:520px;margin:6px auto 0;font-size:11.5px;color:var(--text-soft);}
.redirect-note a{color:var(--accent);text-decoration:none;font-weight:600;transition:color .15s var(--ease);}
.redirect-note a:hover{color:#8AA0FF;text-decoration:underline;}

.wrap{max-width:520px;margin:0 auto;padding:14px 16px 0;}

.card{
  background:linear-gradient(180deg, var(--card2), var(--card));
  border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;
  box-shadow:0 1px 0 rgba(255,255,255,0.02) inset, 0 10px 24px rgba(0,0,0,0.28);
  animation:fadeSlideUp .5s var(--ease) both;
}
.card:nth-of-type(1){animation-delay:.02s;}
.card:nth-of-type(2){animation-delay:.08s;}
.card:nth-of-type(3){animation-delay:.14s;}
.card:nth-of-type(4){animation-delay:.20s;}
.card h2{font-size:12.5px;margin:0 0 12px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-soft);}

label{display:block;font-size:12px;font-weight:600;color:var(--text-soft);margin-bottom:5px;}
input,select{
  width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  background:#0F1219;color:var(--text);font-family:inherit;
  transition:border-color .15s var(--ease), box-shadow .15s var(--ease);
}
input::placeholder{color:var(--text-dim);}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}

.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{
  flex:1 1 auto;min-width:88px;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);
  background:#0F1219;color:var(--text-soft);font-size:13px;font-weight:600;cursor:pointer;
  transition:border-color .15s var(--ease), background .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
}
.seg button:active{transform:scale(.96);}
.seg button.active{border-color:var(--accent);background:var(--accent-soft);color:#C3D0FF;animation:popIn .22s var(--ease);}
.seg.cat button[data-cat="travelFood"].active{border-color:var(--travelfood);background:var(--travelfood-soft);color:var(--travelfood);}
.seg.cat button[data-cat="reserve"].active{border-color:var(--reserve);background:var(--reserve-soft);color:var(--reserve);}
.seg.cat button[data-cat="hotel"].active{border-color:var(--hotel);background:var(--hotel-soft);color:var(--hotel);}

.amount-input{font-size:30px;font-weight:700;padding:12px 12px;text-align:left;font-variant-numeric:tabular-nums;}

#ccSubWrap{max-height:0;opacity:0;overflow:hidden;transition:max-height .28s var(--ease), opacity .22s var(--ease), margin .28s var(--ease);}
#ccSubWrap.open{max-height:120px;opacity:1;margin-bottom:10px;}

.btn-primary{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg, var(--accent), #7C5CFA);color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;
  transition:transform .12s var(--ease), box-shadow .12s var(--ease), filter .12s var(--ease);
  box-shadow:0 6px 18px rgba(91,124,250,0.28);
}
.btn-primary:hover{filter:brightness(1.06);}
.btn-primary:active{transform:scale(.98);}
.btn-primary.pulse{animation:ringPulse .5s var(--ease);}

.btn-ghost{
  background:none;border:1px solid var(--line);color:var(--text-soft);border-radius:9px;padding:6px 10px;
  font-size:12px;cursor:pointer;font-weight:600;transition:border-color .15s var(--ease), color .15s var(--ease), transform .1s var(--ease);
}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-ghost:active{transform:scale(.95);}

.budget-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.budget-row:last-child{border-bottom:none;}
.budget-left{flex:1;min-width:0;}
.budget-name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px currentColor22;}
.dot.travelFood{background:var(--travelfood);}
.dot.reserve{background:var(--reserve);}
.dot.hotel{background:var(--hotel);}
.budget-figs{font-size:11.5px;color:var(--text-soft);margin-top:2px;}
.budget-bar{height:6px;background:var(--line-soft);border-radius:3px;margin-top:6px;overflow:hidden;}
.budget-bar-fill{height:100%;border-radius:3px;transition:width .5s var(--ease), background .3s var(--ease);}
.budget-remaining{font-size:14px;font-weight:700;text-align:right;min-width:76px;font-variant-numeric:tabular-nums;transition:color .2s var(--ease);}
.budget-remaining.neg{color:var(--danger);}

.cash-row{display:flex;justify-content:space-between;align-items:center;}
.cash-amt{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;transition:transform .18s var(--ease);}
.cash-amt.bump{animation:popIn .28s var(--ease);}

.entry{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);gap:10px;animation:fadeSlideUp .35s var(--ease) both;}
.entry:last-child{border-bottom:none;}
.entry-main{min-width:0;}
.entry-cat{font-size:13px;font-weight:700;}
.entry-sub{font-size:11px;color:var(--text-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry-right{text-align:right;flex-shrink:0;}
.entry-amt{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.pill{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:2px 7px;border-radius:9px;margin-top:3px;}
.pill.pending{background:rgba(255,194,75,0.14);color:var(--warn);}
.pill.approved{background:rgba(58,219,118,0.14);color:var(--ok);}
.pill.rejected{background:rgba(255,107,107,0.14);color:var(--danger);}

.empty{font-size:12.5px;color:var(--text-dim);font-style:italic;padding:6px 0;animation:fadeIn .3s var(--ease);}
.hidden{display:none !important;}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:#1B1F2D;border:1px solid var(--line);color:var(--text);
  padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:50;
  animation:toastIn .25s var(--ease);
}
.toast.ok{border-color:rgba(58,219,118,0.4);}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div class="top">
  <div class="top-inner">
    <h1>Daily Expense</h1>
    <span class="sync" id="syncStatus"><span class="sync-dot"></span>Starting…</span>
  </div>
  <div class="redirect-note">Track HDFC/Axis EMIs, receivables &amp; full balances → <a href="portfolio.html">open Portfolio</a></div>
</div>

<div class="wrap">

  <!-- LOG FORM -->
  <div class="card">
    <h2>Log an expense</h2>
    <div class="row" style="margin-bottom:12px;">
      <div><label>Amount (₹)</label><input type="number" id="amount" class="amount-input" placeholder="0" min="0" step="1" inputmode="decimal"></div>
      <div><label>Date</label><input type="date" id="date"></div>
    </div>

    <label>Category</label>
    <div class="seg cat" id="catSeg" style="margin-bottom:12px;">
      <button type="button" data-cat="travelFood" class="active">Travel &amp; Food</button>
      <button type="button" data-cat="reserve">Reserve</button>
      <button type="button" data-cat="hotel">Hotel</button>
    </div>

    <label>Payment method</label>
    <div class="seg" id="methodSeg" style="margin-bottom:2px;">
      <button type="button" data-method="cash" class="active">Cash</button>
      <button type="button" data-method="idfc">IDFC</button>
      <button type="button" data-method="cc">Credit Card</button>
    </div>

    <div id="ccSubWrap">
      <label style="margin-top:10px;">Which card?</label>
      <div class="seg" id="ccSubSeg">
        <button type="button" data-ccsub="hdfc" class="active">HDFC</button>
        <button type="button" data-ccsub="axis">AXIS</button>
        <button type="button" data-ccsub="idfc">IDFC</button>
      </div>
    </div>

    <label style="margin-top:10px;">Note (optional)</label>
    <input type="text" id="note" placeholder="e.g. auto to airport" style="margin-bottom:4px;">

    <button class="btn-primary" id="logBtn">Log expense</button>
  </div>

  <!-- BUDGETS / LIVE BALANCE -->
  <div class="card">
    <h2>Budgets &amp; live balance</h2>
    <div id="budgetList"></div>
  </div>

  <!-- CASH -->
  <div class="card">
    <h2>Cash on hand</h2>
    <div class="cash-row">
      <div class="cash-amt" id="cashAmt">₹0</div>
      <button class="btn-ghost" id="cashEditBtn">Adjust</button>
    </div>
  </div>

  <!-- RECENT ENTRIES -->
  <div class="card">
    <h2>Recent entries</h2>
    <div id="entryList"></div>
    <div class="empty hidden" id="entryEmpty">Nothing logged yet.</div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBv_4lQIqxx0bzx3cWAoTs-ULki8JOJpxc",
  authDomain: "the-shamnad-ledger.firebaseapp.com",
  databaseURL: "https://the-shamnad-ledger-default-rtdb.firebaseio.com",
  projectId: "the-shamnad-ledger",
  storageBucket: "the-shamnad-ledger.firebasestorage.app",
  messagingSenderId: "604342912260",
  appId: "1:604342912260:web:c933768f4b6f63de407c51"
};
let stateRef = null;
let firebaseAvailable = false;
try{
  if(typeof firebase === 'undefined'){
    throw new Error('Firebase SDK scripts did not load (check your internet connection / ad-blocker).');
  }
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  // Shares the same Firebase project as portfolio.html, under its own path,
  // so portfolio.html can read these entries and approve them into the main ledger.
  stateRef = db.ref('dailyExpenseLogger/state');
  firebaseAvailable = true;
}catch(err){
  console.error('Firebase init failed — app will run locally only:', err);
}

(function(){
  const fmt = n => '₹' + Math.round(n).toLocaleString('en-IN');
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Math.random().toString(36).slice(2));
  const todayISO = () => new Date().toISOString().slice(0,10);

  const CATEGORY_LABEL = { travelFood:'Travel & Food', reserve:'Reserve', hotel:'Hotel' };
  const CC_LABEL = { hdfc:'HDFC', axis:'AXIS', idfc:'IDFC' };

  const DEFAULT_STATE = {
    budgets: { travelFood: 15000, reserve: 5000, hotel: 10000 },
    cashBalance: 0,
    entries: []
  };

  let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
  let hasLoadedOnce = false;

  // Firebase Realtime Database drops empty arrays/objects on write, so fill
  // any gaps in remote data against DEFAULT_STATE's shape on read.
  function hydrateState(remote){
    function merge(def, rem){
      if(Array.isArray(def)){
        if(Array.isArray(rem)) return rem;
        if(rem && typeof rem === 'object') return Object.keys(rem).sort((a,b)=>a-b).map(k=>rem[k]);
        return [];
      }
      if(def && typeof def === 'object'){
        const remObj = (rem && typeof rem === 'object') ? rem : {};
        const result = {};
        for(const key of Object.keys(def)) result[key] = merge(def[key], remObj[key]);
        for(const key of Object.keys(remObj)) if(!(key in result)) result[key] = remObj[key];
        return result;
      }
      return rem === undefined ? def : rem;
    }
    return merge(DEFAULT_STATE, remote);
  }

  function setSyncStatus(text, isError){
    const el = document.getElementById('syncStatus');
    if(!el) return;
    el.innerHTML = '<span class="sync-dot"></span>' + text;
    el.className = 'sync' + (isError ? ' err' : '');
  }

  function load(){
    renderAll();
    if(!firebaseAvailable){
      setSyncStatus('Offline — not syncing', true);
      return;
    }
    setSyncStatus('Connecting…');
    stateRef.on('value', (snapshot)=>{
      let remote;
      try{ remote = snapshot.val(); }
      catch(e){ console.error('Failed to read snapshot:', e); setSyncStatus('Sync error — see console', true); return; }
      try{
        if(remote){
          state = hydrateState(remote);
        } else if(!hasLoadedOnce){
          state = hydrateState(state);
        } else {
          return;
        }
        const firstLoad = !hasLoadedOnce;
        hasLoadedOnce = true;
        renderAll();
        setSyncStatus('Synced');
        if(firstLoad && !remote) save();
      }catch(e){
        console.error('Failed to apply remote state:', e);
        setSyncStatus('Error applying synced data', true);
      }
    }, (error)=>{
      console.error('Firebase read failed:', error);
      setSyncStatus('Sync failed — check rules', true);
    });
  }
  async function save(){
    if(!firebaseAvailable){ setSyncStatus('Offline — not syncing', true); return; }
    try{ await stateRef.set(state); setSyncStatus('Synced'); }
    catch(e){ console.error('Firebase write failed:', e); setSyncStatus('Save failed — see console', true); }
  }

  function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str; return d.innerHTML; }

  function showToast(text){
    const t = document.createElement('div');
    t.className = 'toast ok';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(()=>{ t.style.transition='opacity .25s ease'; t.style.opacity='0'; setTimeout(()=>t.remove(), 260); }, 1300);
  }

  // ===== FORM STATE =====
  let selectedCat = 'travelFood';
  let selectedMethod = 'cash';
  let selectedCcSub = 'hdfc';

  document.getElementById('catSeg').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-cat]');
    if(!btn) return;
    selectedCat = btn.dataset.cat;
    document.querySelectorAll('#catSeg button').forEach(b=>b.classList.toggle('active', b===btn));
  });
  document.getElementById('methodSeg').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-method]');
    if(!btn) return;
    selectedMethod = btn.dataset.method;
    document.querySelectorAll('#methodSeg button').forEach(b=>b.classList.toggle('active', b===btn));
    document.getElementById('ccSubWrap').classList.toggle('open', selectedMethod==='cc');
  });
  document.getElementById('ccSubSeg').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-ccsub]');
    if(!btn) return;
    selectedCcSub = btn.dataset.ccsub;
    document.querySelectorAll('#ccSubSeg button').forEach(b=>b.classList.toggle('active', b===btn));
  });

  document.getElementById('logBtn').addEventListener('click', ()=>{
    const amountInp = document.getElementById('amount');
    const amount = parseFloat(amountInp.value);
    if(!amount || amount<=0){ amountInp.focus(); return; }
    const date = document.getElementById('date').value || todayISO();
    const noteInp = document.getElementById('note');
    const note = noteInp.value.trim();

    const entry = {
      id: uid(),
      date, amount,
      category: selectedCat,
      method: selectedMethod,
      ccSub: selectedMethod==='cc' ? selectedCcSub : null,
      note,
      status: 'pending',
      createdAt: Date.now()
    };

    // Cash isn't tracked anywhere else, so deduct it immediately.
    // IDFC / credit card entries wait for approval in Portfolio before touching those balances.
    if(selectedMethod==='cash'){
      state.cashBalance -= amount;
    }
    state.entries.push(entry);

    amountInp.value = '';
    noteInp.value = '';

    const btn = document.getElementById('logBtn');
    btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
    showToast('Logged ' + fmt(amount));

    save(); renderAll();
  });

  // ===== BUDGETS =====
  function categorySpent(cat){
    return state.entries.reduce((s,e)=> e.category===cat ? s+e.amount : s, 0);
  }
  function renderBudgets(){
    const el = document.getElementById('budgetList');
    el.innerHTML = Object.keys(CATEGORY_LABEL).map(cat=>{
      const budget = state.budgets[cat] || 0;
      const spent = categorySpent(cat);
      const remaining = budget - spent;
      const pct = budget>0 ? Math.min(100, (spent/budget)*100) : 0;
      const over = remaining < 0;
      const barColor = over ? 'var(--danger)' : `var(--${cat==='travelFood'?'travelfood':cat})`;
      return `
        <div class="budget-row">
          <div class="budget-left">
            <div class="budget-name"><span class="dot ${cat}"></span>${CATEGORY_LABEL[cat]} <button class="btn-ghost" data-editbudgetbtn="${cat}" style="margin-left:6px;padding:2px 7px;">edit</button></div>
            <div class="budget-figs">${fmt(spent)} spent of ${fmt(budget)}</div>
            <div class="budget-bar"><div class="budget-bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
          </div>
          <div class="budget-remaining ${over?'neg':''}">${fmt(remaining)}</div>
        </div>`;
    }).join('');
    el.querySelectorAll('[data-editbudgetbtn]').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const cat = btn.dataset.editbudgetbtn;
        const input = prompt(`Set ${CATEGORY_LABEL[cat]} budget to (₹):`, state.budgets[cat]);
        if(input===null) return;
        const val = parseFloat(input);
        if(!isFinite(val) || val<0){ alert('Please enter a valid non-negative number.'); return; }
        state.budgets[cat] = val;
        save(); renderAll();
      });
    });
  }

  // ===== CASH =====
  function renderCash(){
    const el = document.getElementById('cashAmt');
    el.textContent = fmt(state.cashBalance);
    el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }
  document.getElementById('cashEditBtn').addEventListener('click', ()=>{
    const input = prompt('Adjust cash balance by (use a negative number to remove, e.g. -500). Current: ' + fmt(state.cashBalance), '0');
    if(input===null) return;
    const delta = parseFloat(input);
    if(!isFinite(delta) || delta===0) return;
    state.cashBalance += delta;
    save(); renderAll();
  });

  // ===== RECENT ENTRIES =====
  function methodDisplay(e){
    if(e.method==='cash') return 'Cash';
    if(e.method==='idfc') return 'IDFC';
    if(e.method==='cc') return (CC_LABEL[e.ccSub]||'CC') + ' Card';
    return e.method;
  }
  function renderEntries(){
    const list = document.getElementById('entryList');
    const sorted = [...state.entries].sort((a,b)=>b.createdAt-a.createdAt).slice(0,50);
    document.getElementById('entryEmpty').classList.toggle('hidden', sorted.length>0);
    list.innerHTML = sorted.map((e,i)=>{
      const pillClass = e.status==='approved' ? 'approved' : (e.status==='rejected' ? 'rejected' : 'pending');
      const pillText = e.status==='approved' ? 'Approved' : (e.status==='rejected' ? 'Dismissed' : 'Pending');
      return `
        <div class="entry" style="animation-delay:${Math.min(i,8)*0.03}s;">
          <div class="entry-main">
            <div class="entry-cat">${CATEGORY_LABEL[e.category]||e.category}</div>
            <div class="entry-sub">${e.date} · ${methodDisplay(e)}${e.note?' · '+escapeHtml(e.note):''}</div>
          </div>
          <div class="entry-right">
            <div class="entry-amt">${fmt(e.amount)}</div>
            <span class="pill ${pillClass}">${pillText}</span>
          </div>
        </div>`;
    }).join('');
  }

  function renderAll(){
    renderBudgets();
    renderCash();
    renderEntries();
  }

  document.getElementById('date').value = todayISO();
  load();
})();
</script>
</body>
</html>
